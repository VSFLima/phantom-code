name: Build Distro Artifacts

# 🐧 Constrói a Phantom (arm64) e publica em GitHub Release.
#
# O app baixa o artefato internamente (Toolbox → Distros → Instalar) com
# barra de progresso e validação SHA-256, via PhantomMirror.PHANTOM_URL.
#
# AUTÔNOMO (t30): o QEMU estático é COMPILADO dentro deste mesmo workflow
# (cross-compile nativo x86_64 → aarch64) e embutido no tarball — NÃO depende
# da Release `qemu-aarch64` (que pode ser apagada). Uma única release
# (`distro-phantom`) alimenta o app: rootfs + kernel + initrd + qemu.
#
# Artefato gerado:  phantom.tar.gz
#   ├── rootfs.img   (ext2 — Debian bookworm arm64 com ferramentas + sysvinit)
#   ├── kernel       (vmlinuz do linux-image-arm64)
#   ├── initrd.img   (initramfs do pacote)
#   ├── qemu-system-aarch64 (QEMU estático oficial do projeto, compilado aqui)
#   └── *.rom *.bin *.efi   (ROMs do pc-bios — ex.: efi-virtio.rom; o QEMU 9.x
#                            procura no CWD do processo, e o app roda com cwd =
#                            pasta da distro → boot não morre mais no firmware)
#
# Boot no app:  -kernel kernel -initrd initrd.img -drive rootfs.img \
#               -append "root=/dev/vda rw console=ttyAMA0 console=hvc0"
# O guest sobe com sysvinit → /etc/phantom-boot.sh monta a pasta da distro
# (9p darkcode-distro) e executa o dark-code-init.sh real do app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phantom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register binfmt (qemu arm64)
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build arm64 rootfs (docker + Debian bookworm)
        timeout-minutes: 45
        run: |
          # timeout global do container: travamento do qemu-user vira falha rápida
          # (docker ignora SIGTERM bloqueado — --kill-after força o SIGKILL)
          timeout --kill-after=60 1500 docker run --platform linux/arm64 --name phantom debian:bookworm-slim bash -c '
            set -e
            apt-get update
            # O python3.11 segfaulta sob o qemu-user do runner (postinst py3compile).
            # Desviamos py3compile/pycompile para /bin/true: no guest o python roda
            # de verdade no aparelho; o byte-compile no build só dispara o crash.
            dpkg-divert --local --add --rename /usr/bin/py3compile
            ln -sf /bin/true /usr/bin/py3compile
            dpkg-divert --local --add --rename /usr/bin/pycompile
            ln -sf /bin/true /usr/bin/pycompile
            # DPkg::Options (case-sensitive!) --no-triggers: NENHUM trigger roda no
            # build. Sob qemu-user os triggers penduram (libc-bin/ldconfig travou
            # 35min, initramfs-tools 35min, php8.2-cli 27min) — sempre no final do
            # apt. O postinst do linux-image gera o initrd.img (unico processo
            # pesado que FUNCIONA, ~6.5min). Equivalente manual do ldconfig roda
            # com timeout (cache so e aceleracao; o loader acha os dirs multiarch
            # sem ele).
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o DPkg::Options::=--no-triggers \
              bash ca-certificates curl wget git \
              python3 openssh-client tzdata nano vim-tiny htop file \
              linux-image-arm64 initramfs-tools e2fsprogs \
              sysvinit-core sysv-rc iproute2 isc-dhcp-client

            # Descarta triggers adiados (ficaram pendentes com --no-triggers)
            rm -f /var/lib/dpkg/triggers/File /var/lib/dpkg/triggers/Unincorp
            timeout 60 ldconfig || true

            # PHP: o trigger "php8.2-cli" (interest /etc/php/8.2/cli/conf.d) PENDURA
            # sob qemu-user. O php e necessario no guest (server PHP do Preview),
            # entao instalamos via dpkg --unpack: extrai os binarios SEM rodar
            # postinst/triggers. conf.d (extensoes) e php.ini montados manualmente —
            # o php roda nativo (arm64 real) no aparelho.
            apt-get install -y --no-install-recommends -o DPkg::Options::=--no-triggers \
              libargon2-1 libsodium23 libedit2 libmagic1 media-types
            rm -f /var/lib/dpkg/triggers/File /var/lib/dpkg/triggers/Unincorp
            cd /tmp
            apt-get download php8.2-cli php8.2-common php8.2-opcache php8.2-readline php8.2-curl php-cli php-curl
            for d in *.deb; do dpkg --unpack --no-triggers "$d" >/dev/null 2>&1 || true; done
            mkdir -p /etc/php/8.2/cli/conf.d
            for so in /usr/lib/php/20220829/*.so; do
              [ -e "$so" ] && ln -sf "$so" "/etc/php/8.2/cli/conf.d/$(basename "$so" .so).ini"
            done
            cp /usr/lib/php/8.2/php.ini-production.cli /etc/php/8.2/cli/php.ini
            ln -sf /usr/bin/php8.2 /usr/bin/php

            rm -rf /var/lib/apt/lists/*
          '
          docker export phantom > /tmp/rootfs.tar
          mkdir -p /tmp/rootfs
          tar -xf /tmp/rootfs.tar -C /tmp/rootfs

      - name: Grab kernel + initrd
        run: |
          cp -L /tmp/rootfs/boot/vmlinuz-* /tmp/kernel
          if ! ls /tmp/rootfs/boot/initrd.img-* >/dev/null 2>&1; then
            echo "❌ initrd.img não veio no pacote linux-image — gere com update-initramfs dentro do container"
            exit 1
          fi
          cp -L /tmp/rootfs/boot/initrd.img-* /tmp/initrd.img
          ls -la /tmp/kernel /tmp/initrd.img

      # ─────────────────────────────────────────────────────────────────────
      # T-D2/T-D4 — BOOT REAL do guest (sysvinit + bootstrap Phantom)
      # ─────────────────────────────────────────────────────────────────────
      # O kernel agora acha /sbin/init (sysvinit-core) em vez de cair no
      # /bin/sh cru. O init roda /etc/phantom-boot.sh que:
      #   1. monta a pasta da distro do app via virtio-9p (tag darkcode-distro)
      #   2. executa o dark-code-init.sh REAL vindo do app (rede, usuário,
      #      workspace 9p, phantom-agent.sh e shell de login)
      # Fallback: uma cópia do init embutida no rootfs (/usr/local/lib/phantom)
      # — usada quando o QEMU roda sem a pasta 9p do app (teste manual).
      - name: Configure guest boot (sysvinit + phantom bootstrap)
        run: |
          set -e
          mkdir -p /tmp/rootfs/usr/local/lib/phantom
          # Cópia de segurança do init do app dentro do próprio rootfs
          cp android/app/src/main/assets/linux/dark-code-init.sh /tmp/rootfs/usr/local/lib/phantom/dark-code-init.sh
          cp android/app/src/main/assets/linux/phantom-agent.sh /tmp/rootfs/usr/local/lib/phantom/phantom-agent.sh
          chmod +x /tmp/rootfs/usr/local/lib/phantom/dark-code-init.sh /tmp/rootfs/usr/local/lib/phantom/phantom-agent.sh

          # Bootstrap: monta o 9p da distro (onde o app deixa o init + config)
          cat > /tmp/rootfs/etc/phantom-boot.sh <<'EOF'
          #!/bin/sh
          # T-D4: bootstrap do guest. Monta a pasta da distro do app (9p) e
          # executa o dark-code-init.sh real; cai no fallback embutido sem 9p.
          mkdir -p /mnt/phantom
          if mount -t 9p -o trans=virtio,version=9p2000.L,msize=1048576 darkcode-distro /mnt/phantom 2>/dev/null; then
            if [ -x /mnt/phantom/dark-code-init.sh ]; then
              exec /mnt/phantom/dark-code-init.sh
            fi
          fi
          if [ -x /usr/local/lib/phantom/dark-code-init.sh ]; then
            exec /usr/local/lib/phantom/dark-code-init.sh
          fi
          echo "phantom-boot: nenhum init disponível" >&2
          exec /bin/sh
          EOF
          chmod +x /tmp/rootfs/etc/phantom-boot.sh

          # inittab do sysvinit: sysinit roda o bootstrap; getty em hvc0 com
          # auto-login (user) como rede de segurança depois que o shell sair.
          cat > /tmp/rootfs/etc/inittab <<'EOF'
          id:2:initdefault:
          ::sysinit:/etc/phantom-boot.sh
          ::respawn:/sbin/getty -a user -L hvc0 0 vt100
          EOF
          echo "inittab + phantom-boot.sh configurados"

      # ─────────────────────────────────────────────────────────────────────
      # QEMU ESTÁTICO (cross-compile nativo) — embutido no tarball da distro
      # ─────────────────────────────────────────────────────────────────────
      - name: Install cross toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            ninja-build pkg-config python3 python3-pip \
            autoconf automake libtool make wget ca-certificates \
            bison flex gettext
          # glib 2.80 exige meson >= 1.1; o do Ubuntu 22.04 é 0.61.
          sudo pip3 install --break-system-packages meson

      - name: Build static deps for aarch64 (zlib, libffi, pcre2, pixman)
        run: |
          set -e
          export PREFIX=/opt/arm
          export CROSS=aarch64-linux-gnu
          sudo mkdir -p $PREFIX
          cd /tmp
          # fetch <dest> <url1> <url2…>: tenta fontes em ordem (GitHub primeiro — mais estável)
          fetch() { local d="$1"; shift; for u in "$@"; do
            if wget -q -O "$d" "$u" 2>/dev/null && [ -s "$d" ]; then echo "✓ $u"; return 0; fi
            rm -f "$d"; done; echo "❌ falhou download"; exit 1; }
          fetch zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz" \
            "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
          tar xzf zlib.tar.gz && cd zlib-1.3.1
          CC=${CROSS}-gcc AR=${CROSS}-ar RANLIB=${CROSS}-ranlib \
            ./configure --static --prefix=$PREFIX
          make -j2 && sudo make install
          cd /tmp
          fetch libffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz"
          tar xzf libffi.tar.gz && cd libffi-3.4.6
          ./configure --host=${CROSS} --prefix=$PREFIX --disable-shared --enable-static
          make -j2 && sudo make install
          cd /tmp
          fetch pcre2.tar.gz \
            "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz"
          tar xzf pcre2.tar.gz && cd pcre2-10.44
          ./configure --host=${CROSS} --prefix=$PREFIX --disable-shared --enable-static
          make -j2 && sudo make install
          cd /tmp
          fetch pixman.tar.gz \
            "https://www.cairographics.org/releases/pixman-0.42.2.tar.gz" \
            "https://gitlab.freedesktop.org/pixman/pixman/-/archive/pixman-0.42.2/pixman-0.42.2.tar.gz"
          tar xzf pixman.tar.gz && cd pixman-0.42.2
          ./configure --host=${CROSS} --prefix=$PREFIX --disable-shared --enable-static \
            --disable-arm-simd --disable-arm-neon --disable-arm-iwmmxt --disable-arm-iwmmxt2
          make -j2 && sudo make install
          cd /tmp

      - name: Build static glib for aarch64 (meson cross)
        run: |
          set -e
          export PREFIX=/opt/arm
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig
          cat > /tmp/arm-cross.txt <<'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          cd /tmp
          fetch() { local d="$1"; shift; for u in "$@"; do
            if wget -q -O "$d" "$u" 2>/dev/null && [ -s "$d" ]; then echo "✓ $u"; return 0; fi
            rm -f "$d"; done; echo "❌ falhou download"; exit 1; }
          fetch glib.tar.xz \
            "https://download.gnome.org/sources/glib/2.80/glib-2.80.4.tar.xz" \
            "https://github.com/GNOME/glib/archive/refs/tags/2.80.4.tar.gz"
          tar xf glib.tar.xz && cd glib-2.80.4
          meson setup build --cross-file /tmp/arm-cross.txt --prefix=$PREFIX \
            --default-library=static \
            -Dnls=disabled -Dtests=false -Dinstalled_tests=false \
            -Dgtk_doc=false -Dman=false -Dlibmount=disabled -Dlibelf=disabled
          ninja -C build && sudo ninja -C build install
          cd /tmp

      # libslirp ESTÁTICO (aarch64): o `-netdev user` do app (rede SLIRP/NAT do
      # guest) exige libslirp. O QEMU 9.x não traz o slirp como submodulo — a
      # dependência é resolvida por pkg-config, e sem libslirp o build sai SEM
      # rede (QEMU recusa `-netdev user` no boot — a VM nunca sobe).
      - name: Build static libslirp for aarch64 (meson cross)
        run: |
          set -e
          export PREFIX=/opt/arm
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig
          cd /tmp
          fetch() { local d="$1"; shift; for u in "$@"; do
            if wget -q -O "$d" "$u" 2>/dev/null && [ -s "$d" ]; then echo "✓ $u"; return 0; fi
            rm -f "$d"; done; echo "❌ falhou download"; exit 1; }
          fetch libslirp.tar.gz \
            "https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.8.0/libslirp-v4.8.0.tar.gz" \
            "https://github.com/slirp/libslirp/archive/refs/tags/v4.8.0.tar.gz"
          tar xzf libslirp.tar.gz && cd libslirp-*
          meson setup build --cross-file /tmp/arm-cross.txt --prefix=$PREFIX \
            --default-library=static
          ninja -C build && sudo ninja -C build install
          ls -la $PREFIX/lib/libslirp.a
          cd /tmp

      - name: Build static QEMU (aarch64-softmmu, cross)
        timeout-minutes: 45
        run: |
          set -e
          export PREFIX=/opt/arm
          export PKG_CONFIG=pkg-config
          export PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig
          cd /tmp
          fetch() { local d="$1"; shift; for u in "$@"; do
            if wget -q -O "$d" "$u" 2>/dev/null && [ -s "$d" ]; then echo "✓ $u"; return 0; fi
            rm -f "$d"; done; echo "❌ falhou download"; exit 1; }
          fetch qemu.tar.xz \
            "https://download.qemu.org/qemu-9.1.0.tar.xz" \
            "https://github.com/qemu/qemu/archive/refs/tags/v9.1.0.tar.gz"
          tar xf qemu.tar.xz && cd qemu-9.1.0
          ./configure --cross-prefix=aarch64-linux-gnu- \
            --target-list=aarch64-softmmu --static --disable-werror --prefix=/usr \
            --enable-slirp \
            --disable-gnutls --disable-nettle --disable-gcrypt \
            --disable-gtk --disable-sdl --disable-vnc --disable-spice --disable-xen \
            --disable-libnfs --disable-smartcard --disable-usb-redir --disable-glusterfs \
            --disable-curl --disable-snappy --disable-bzip2 --disable-lzo --disable-seccomp
          make -j2
          cp build/qemu-system-aarch64 /tmp/qemu-system-aarch64
          ls -la /tmp/qemu-system-aarch64
          sha256sum /tmp/qemu-system-aarch64

      # ─────────────────────────────────────────────────────────────────────
      - name: Create rootfs.img (mkfs.ext2 -d — imagem ext2 populada direto do dir)
        run: |
          # `du -s` subconta hardlinks (docker export) — usamos -l e ainda sobramos
          # 140% + 200 MB. ext2 de verdade via e2fsprogs (muito mais robusto que
          # genext2fs, que estourava "couldn't allocate a block").
          SIZE_MB=$(( $(du -sk -l /tmp/rootfs | awk '{print $1}') * 140 / 100 / 1024 + 200 ))
          echo "rootfs real: $(du -sk /tmp/rootfs | awk '{print $1}') KiB → ext2: ${SIZE_MB} MiB"
          truncate -s "${SIZE_MB}M" /tmp/rootfs.img
          sudo mkfs.ext2 -q -F /tmp/rootfs.img -d /tmp/rootfs
          ls -la /tmp/rootfs.img

      - name: Package artifact
        run: |
          cd /tmp
          # T-D1: o QEMU 9.x procura ROMs de firmware no CWD do processo — as
          # ROMs do pc-bios (efi-virtio.rom etc.) vão FLAT no tarball, junto do
          # rootfs/kernel. O app roda o QEMU com cwd = pasta da distro, então o
          # boot não morre mais com "Could not open 'efi-virtio.rom'".
          mkdir -p /tmp/roms
          find /tmp/qemu-9.1.0/pc-bios -maxdepth 1 -type f -exec cp {} /tmp/roms/ \;
          cp /tmp/roms/* ./
          tar czf phantom.tar.gz rootfs.img kernel initrd.img qemu-system-aarch64 *.rom *.bin *.efi 2>/dev/null || true
          # Garante que ao menos efi-virtio.rom entrou (a ROM exigida no boot virt)
          tar tzf phantom.tar.gz | grep -q 'efi-virtio\.rom' || { echo "❌ efi-virtio.rom ausente no tarball"; exit 1; }
          echo "=== phantom.tar.gz ==="
          ls -la phantom.tar.gz
          sha256sum phantom.tar.gz

      - name: Publish as Release (tag fixa para o app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete distro-phantom --yes 2>/dev/null || true
          gh release create distro-phantom /tmp/phantom.tar.gz \
            --title "Phantom rootfs (arm64) $(date +%Y-%m-%d)" \
            --notes "Phantom — Debian bookworm arm64 para QEMU (virt/cortex-a72). Contém rootfs.img + kernel + initrd.img + qemu-system-aarch64 (compilado no próprio build). O app baixa um pacote unificado (Toolbox → Distros)."

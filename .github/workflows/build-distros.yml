name: Build Distro Artifacts

# 🐧 Constrói a Phantom Base (arm64) e publica em GitHub Release.
#
# O app baixa o artefato internamente (Toolbox → Distros → Instalar) com
# barra de progresso e validação SHA-256, via PhantomMirror.PHANTOM_BASE_URL.
#
# Artefato gerado:  phantom-base.tar.gz
#   ├── rootfs.img   (ext2 de 1 GiB — Debian bookworm arm64 com ferramentas)
#   ├── kernel       (vmlinuz do linux-image-arm64)
#   └── initrd.img   (initramfs do pacote)
#
# Boot no app:  -kernel kernel -initrd initrd.img -drive rootfs.img \
#               -append "root=/dev/vda rw console=ttyAMA0"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phantom-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register binfmt (qemu arm64)
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build arm64 rootfs (docker + Debian bookworm)
        run: |
          docker run --platform linux/arm64 --name phantom debian:bookworm-slim bash -c '
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              bash ca-certificates curl wget git \
              python3 python3-pip nodejs npm \
              openssh-client tzdata nano vim-tiny htop file \
              linux-image-arm64 initramfs-tools e2fsprogs
            rm -rf /var/lib/apt/lists/*
          '
          docker export phantom > /tmp/rootfs.tar
          mkdir -p /tmp/rootfs
          tar -xf /tmp/rootfs.tar -C /tmp/rootfs

      - name: Grab kernel + initrd
        run: |
          cp -L /tmp/rootfs/boot/vmlinuz-* /tmp/kernel
          if ! ls /tmp/rootfs/boot/initrd.img-* >/dev/null 2>&1; then
            echo "❌ initrd.img não veio no pacote linux-image — gere com update-initramfs dentro do container"
            exit 1
          fi
          cp -L /tmp/rootfs/boot/initrd.img-* /tmp/initrd.img
          ls -la /tmp/kernel /tmp/initrd.img

      - name: Create rootfs.img (genext2fs — ext2 dinâmico)
        run: |
          sudo apt-get update
          sudo apt-get install -y genext2fs
          # Tamanho do rootfs em KiB → blocos de 4KiB com 40% de folga.
          # (linux-image-arm64 + python3 + nodejs estouram os 1 GiB fixos do genext2fs)
          SIZE_KIB=$(du -sk /tmp/rootfs | awk '{print $1}')
          BLOCKS=$(( SIZE_KIB * 140 / 100 / 4 ))
          # Inodes: 1 por 4KiB (nodejs instala dezenas de milhares de arquivos pequenos)
          INODES=$(( BLOCKS ))
          echo "rootfs: ${SIZE_KIB} KiB → ext2: $(( BLOCKS * 4 / 1024 )) MiB, ${INODES} inodes"
          # device nodes exigem root (sudo)
          sudo genext2fs -b "$BLOCKS" -i 4096 -d /tmp/rootfs /tmp/rootfs.img
          ls -la /tmp/rootfs.img

      - name: Package artifact
        run: |
          cd /tmp
          tar czf phantom-base.tar.gz rootfs.img kernel initrd.img
          echo "=== phantom-base.tar.gz ==="
          ls -la phantom-base.tar.gz

      - name: Publish as Release (tag fixa para o app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete distro-phantom-base --yes 2>/dev/null || true
          gh release create distro-phantom-base /tmp/phantom-base.tar.gz \
            --title "Phantom Base rootfs (arm64) $(date +%Y-%m-%d)" \
            --notes "Phantom Base — Debian bookworm arm64 para QEMU (virt/cortex-a72). Contém rootfs.img + kernel + initrd.img. Baixado pelo app com download interno (Toolbox → Distros)."

  # ── T29 · Binário QEMU ─────────────────────────────────────────────
  # Compila o qemu-system-aarch64 ESTÁTICO (musl/Alpine) — roda nativo no
  # Android sem libs externas. Publicado na Release `qemu-aarch64`; o app
  # baixa automaticamente quando o usuário instala uma distro.
  qemu-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register binfmt (qemu arm64)
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static QEMU (aarch64-softmmu, musl)
        run: |
          docker run --platform linux/arm64 --rm -v "$PWD:/out" alpine:edge sh -c '
            set -e
            apk add --no-cache build-base gcc g++ make pkgconf \
              glib-dev pixman-dev zlib-dev ninja python3 py3-pip \
              gettext bison flex util-linux-dev
            wget -q https://download.qemu.org/qemu-9.1.0.tar.xz
            tar xf qemu-9.1.0.tar.xz && cd qemu-9.1.0
            ./configure --target-list=aarch64-softmmu --static --disable-werror --prefix=/usr
            make -j2
            cp build/qemu-system-aarch64 /out/qemu-system-aarch64
          '
          ls -la qemu-system-aarch64
          sha256sum qemu-system-aarch64 | tee qemu-system-aarch64.sha256

      - name: Publish as Release (tag fixa para o app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete qemu-aarch64 --yes 2>/dev/null || true
          gh release create qemu-aarch64 qemu-system-aarch64 qemu-system-aarch64.sha256 \
            --title "QEMU arm64 estático (musl) $(date +%Y-%m-%d)" \
            --notes "qemu-system-aarch64 estático — roda direto no Android sem libs externas. Baixado automaticamente pelo app ao instalar uma distro."

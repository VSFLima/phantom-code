name: Build APK

# 🔒 Build MANUAL até o app ficar pronto (Fase 2+).
# Para gerar um APK: Actions → Build APK → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PHANTOM_KEYSTORE_BASE64: ${{ secrets.PHANTOM_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        if: env.PHANTOM_KEYSTORE_BASE64 != ''
        run: |
          echo "$PHANTOM_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build release APK
        env:
          PHANTOM_SIGNING: "true"
          PHANTOM_STORE_PASSWORD: ${{ secrets.PHANTOM_STORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-code-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

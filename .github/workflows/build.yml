name: Build APK

# 🔒 Build MANUAL até o app ficar pronto (Fase 2+).
# Para gerar um APK: Actions → Build APK → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PHANTOM_KEYSTORE_BASE64: ${{ secrets.PHANTOM_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        if: env.PHANTOM_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android
          echo "$PHANTOM_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          echo "keystore restaurado ($(wc -c < android/release.keystore) bytes)"

      - name: Bundle native QEMU binary (embutido no APK)
        run: |
          set -e
          mkdir -p android/app/src/main/assets/qemu
          # 1) Binário direto da Release qemu-aarch64 (se publicada)
          if curl -sfL --retry 3 --retry-delay 2 -o /tmp/qemu-system-aarch64 \
            "https://github.com/VSFLima/phantom-code/releases/download/qemu-aarch64/qemu-system-aarch64"; then
            cp /tmp/qemu-system-aarch64 android/app/src/main/assets/qemu/qemu-system-aarch64
          else
            # 2) Fallback: extrai o qemu do pacote unificado (Release distro-phantom)
            curl -sfL --retry 3 --retry-delay 2 -o /tmp/phantom.tar.gz \
              "https://github.com/VSFLima/phantom-code/releases/download/distro-phantom/phantom.tar.gz"
            mkdir -p /tmp/phantom-tar
            tar -xzf /tmp/phantom.tar.gz -C /tmp/phantom-tar
            find /tmp/phantom-tar -name 'qemu-system-aarch64' -size +1M -exec cp {} android/app/src/main/assets/qemu/qemu-system-aarch64 \;
          fi
          test -s android/app/src/main/assets/qemu/qemu-system-aarch64
          ls -la android/app/src/main/assets/qemu/
          echo "QEMU embutido: $(wc -c < android/app/src/main/assets/qemu/qemu-system-aarch64) bytes"

      - name: Build release APK
        env:
          PHANTOM_SIGNING: "true"
          PHANTOM_STORE_PASSWORD: ${{ secrets.PHANTOM_STORE_PASSWORD }}
          PHANTOM_KEY_ALIAS: ${{ secrets.PHANTOM_KEY_ALIAS }}
          PHANTOM_KEY_PASSWORD: ${{ secrets.PHANTOM_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Publish APK as draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android
          ls -la app/build/outputs/apk/release/
          TAG="apk-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Phantom-Code APK $(date +%Y-%m-%d %H:%M)" \
            --notes "APK assinado com a chave VSFLima/Asgard (build manual)." \
            --draft

name: Build QEMU Binary

# 🐧 Compila o qemu-system-aarch64 ESTÁTICO (glibc/Debian arm64) — roda nativo
# no Android sem libs externas — e publica na Release `qemu-aarch64`.
#
# O app baixa automaticamente quando o usuário instala uma distro
# (Toolbox → Distros → Instalar), via PhantomMirror.QEMU_BINARY_URL.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qemu-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register binfmt (qemu arm64)
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build static QEMU (aarch64-softmmu, static glibc)
        run: |
          docker run --platform linux/arm64 --rm -v "$PWD:/out" debian:bookworm-slim bash -c '
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential pkg-config ninja-build python3 bison flex gettext git \
              wget ca-certificates \
              zlib1g-dev libglib2.0-dev libpixman-1-dev libpcre2-dev libffi-dev \
              libmount-dev libblkid-dev libudev-dev libattr1-dev libselinux1-dev
            wget -q https://download.qemu.org/qemu-9.1.0.tar.xz
            tar xf qemu-9.1.0.tar.xz && cd qemu-9.1.0
            ./configure --target-list=aarch64-softmmu --static --disable-werror --prefix=/usr \
              --disable-gnutls --disable-nettle --disable-gcrypt \
              --disable-gtk --disable-sdl --disable-vnc --disable-spice --disable-xen \
              --disable-libnfs --disable-smartcard --disable-usb-redir --disable-glusterfs \
              --disable-curl --disable-snappy --disable-bzip2 --disable-lzo --disable-seccomp
            make -j2
            cp build/qemu-system-aarch64 /out/qemu-system-aarch64
          '
          ls -la qemu-system-aarch64
          sha256sum qemu-system-aarch64 | tee qemu-system-aarch64.sha256

      - name: Publish as Release (tag fixa para o app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete qemu-aarch64 --yes 2>/dev/null || true
          gh release create qemu-aarch64 qemu-system-aarch64 qemu-system-aarch64.sha256 \
            --title "QEMU arm64 estático (musl) $(date +%Y-%m-%d)" \
            --notes "qemu-system-aarch64 estático — roda direto no Android sem libs externas. Baixado automaticamente pelo app ao instalar uma distro."

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Phantom Editor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      overscroll-behavior: none;
    }
    #editor {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 14px;
    }
    .ace_editor { height: 100%; }
    .ace_editor:focus { outline: none; }
    .ace_scroller::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .ace_scroller::-webkit-scrollbar-thumb {
      background: rgba(159, 77, 255, 0.4);
      border-radius: 4px;
    }
    .ace_scroller::-webkit-scrollbar-track {
      background: transparent;
    }
    .phantom-custom-selection .ace_marker-layer .ace_selection {
      background: var(--phantom-sel, rgba(159, 77, 255, 0.35)) !important;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="ace.bundle.js"></script>
  <script src="editor_tools.bundle.js"></script>
  <script src="editor-themes.js"></script>
  <script src="ace-themes.js"></script>
  <script src="editor.js"></script>
</body>
</html>
